name: build

# Every push to main builds every app under apps/ and publishes one release holding
# <custom_release_name>.bin for each, so
#   https://github.com/<owner>/<repo>/releases/latest/download/<Name>.bin
# (the links registered as Launcher favorites on the Cardputer) always serve the newest build.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            apps/*/.pio/libdeps
          key: pio-${{ runner.os }}-${{ hashFiles('apps/*/platformio.ini') }}
      - run: pip install platformio==6.2.0
      - name: Build all apps
        run: |
          mkdir -p dist
          names=()
          for ini in apps/*/platformio.ini; do
            dir=$(dirname "$ini")
            name=$(sed -n 's/^custom_release_name *= *//p' "$ini")
            name=${name:-$(basename "$dir")}
            pio run -d "$dir"
            cp "$dir"/.pio/build/*/firmware.bin "dist/$name.bin"
            names+=("\"$name\"")
          done
          # The Sync app reads this list and turns each name into a Launcher favorite.
          # Names only: Sync builds the download URLs itself from this repository.
          (IFS=,; echo "[${names[*]}]") > dist/apps.json
          cat dist/apps.json
          ls -l dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: |
            dist/*.bin
            dist/apps.json
          make_latest: true
